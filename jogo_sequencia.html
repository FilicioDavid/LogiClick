<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiClick - Sequência Lógica</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-primary: #1A1AAB;
            --fundo-creme: #FEFEE2;
            --branco: #ffffff;
            --roxo-destaque: #8e44ad;
            --sucesso: #28a745;
            --erro: #e74c3c;
        }

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: var(--fundo-creme);
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Cabeçalho Padronizado */
        header {
            background-color: var(--azul-primary);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: white;
            box-sizing: border-box;
        }

        .btn-voltar {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn-voltar:hover {
            background: white;
            color: var(--azul-primary);
        }

        .titulo-header {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            margin: 0;
        }

        /* Container do Jogo */
        .container {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        #fase {
            font-size: 1.1em;
            background: var(--roxo-destaque);
            color: white;
            display: inline-block;
            padding: 8px 25px;
            border-radius: 50px;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(142, 68, 173, 0.2);
        }

        h1 {
            color: var(--azul-primary);
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 10px;
        }

        /* Sequência Numérica */
        #seq {
            font-size: 3.5em;
            letter-spacing: 15px;
            margin: 50px 0;
            color: #2c3e50;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            min-height: 1.2em;
        }

        .alvo-vazio {
            color: #bdc3c7;
            border-bottom: 6px solid var(--roxo-destaque);
            padding: 0 10px;
            min-width: 60px;
            display: inline-block;
        }

        /* Opções de Resposta */
        .opcoes-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px auto;
        }

        .card {
            min-width: 80px;
            height: 80px;
            font-size: 1.8em;
            font-weight: bold;
            cursor: pointer;
            background: var(--branco);
            border: none;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            color: var(--roxo-destaque);
            font-family: 'Montserrat', sans-serif;
        }

        .card:hover {
            transform: translateY(-8px);
            background-color: var(--roxo-destaque);
            color: white;
            box-shadow: 0 12px 20px rgba(142, 68, 173, 0.3);
        }

        .card:active {
            transform: scale(0.95);
        }

        /* Mensagens de Feedback */
        #mensagem {
            margin-top: 30px;
            font-size: 1.3em;
            font-weight: 600;
            height: 40px;
            transition: 0.3s;
        }

        .correto { color: var(--sucesso); animation: pulse 0.5s ease; }
        .errado { color: var(--erro); animation: shake 0.4s ease; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @media (max-width: 600px) {
            #seq { font-size: 2.2em; letter-spacing: 8px; }
            .card { min-width: 70px; height: 70px; font-size: 1.5em; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-voltar">← Voltar</a>
        <h1 class="titulo-header">LogiClick</h1>
        <div style="width: 85px;"></div>
    </header>

    <div class="container">
        <div id="fase">Fase 1</div>
        <h1>Complete a sequência lógica</h1>

        <h2 id="seq"></h2>

        <div id="opcoes" class="opcoes-container"></div>

        <div id="mensagem"></div>
    </div>

    <script>
        let fase = 1;
        let respostaCorreta;
        let bloqueado = false;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function randomNumero(max) {
            return Math.floor(Math.random() * max);
        }

        function gerar() {
            const seqElement = document.getElementById("seq");
            const opcoesDiv = document.getElementById("opcoes");
            const mensagem = document.getElementById("mensagem");
            const labelFase = document.getElementById("fase");
            
            opcoesDiv.innerHTML = "";
            mensagem.innerText = "";
            mensagem.className = "";
            bloqueado = false;

            let inicio = randomNumero(10) + 1;
            let razao;
            let sequencia = [];

            // Lógica de dificuldade progressiva
            if (fase <= 3) {
                razao = randomNumero(3) + 1;
                for(let i=0; i<3; i++) sequencia.push(inicio + (i * razao));
                respostaCorreta = inicio + (3 * razao);
            } else if (fase <= 8) {
                razao = randomNumero(5) + 2;
                let sinal = Math.random() > 0.5 ? 1 : -1;
                if (sinal === -1) inicio += 25;
                for(let i=0; i<3; i++) sequencia.push(inicio + (i * razao * sinal));
                respostaCorreta = inicio + (3 * razao * sinal);
            } else {
                inicio = randomNumero(4) + 1;
                let mult = Math.random() > 0.5 ? 2 : 3;
                for(let i=0; i<3; i++) sequencia.push(inicio * Math.pow(mult, i));
                respostaCorreta = inicio * Math.pow(mult, 3);
            }

            seqElement.innerHTML = `${sequencia.join(" ")} <span class="alvo-vazio" id="lacuna">?</span>`;

            let opcoes = [
                respostaCorreta, 
                respostaCorreta + (randomNumero(4) + 1), 
                respostaCorreta - (randomNumero(4) + 1)
            ];
            opcoes = shuffle(opcoes);

            opcoes.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "card";
                btn.innerText = opt;

                btn.onclick = function() {
                    if (bloqueado) return;

                    if (opt === respostaCorreta) {
                        bloqueado = true;
                        const lacuna = document.getElementById("lacuna");
                        lacuna.innerText = opt;
                        lacuna.style.color = "var(--sucesso)";
                        lacuna.style.borderBottomColor = "var(--sucesso)";
                        
                        mensagem.className = "correto";
                        mensagem.innerText = "Lógica impecável!";
                        
                        fase++;
                        setTimeout(() => {
                            labelFase.innerText = "Fase " + fase;
                            gerar();
                        }, 1200);
                    } else {
                        mensagem.className = "errado";
                        mensagem.innerText = "Essa sequência pede outro número...";
                        btn.style.color = "var(--erro)";
                        setTimeout(() => {
                             btn.style.color = "";
                             mensagem.innerText = "";
                        }, 1000);
                    }
                };
                opcoesDiv.appendChild(btn);
            });
        }

        gerar();
    </script>
</body>
</html>
