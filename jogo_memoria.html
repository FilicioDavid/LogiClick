<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiClick - Memória Animal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <style>
        :root {
            --azul-primary: #1A1AAB;
            --fundo-creme: #FEFEE2;
            --branco: #ffffff;
            --sucesso: #28a745;
            --erro: #e74c3c;
            --amarelo: #f1c40f;
        }

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: var(--fundo-creme);
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            background-color: var(--azul-primary);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: white;
            box-sizing: border-box;
        }

        .btn-voltar {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn-voltar:hover { background: white; color: var(--azul-primary); }

        .titulo-header { font-family: 'Montserrat', sans-serif; font-size: 24px; margin: 0; }

        .container { padding: 40px 20px; max-width: 600px; margin: 0 auto; }

        #score-board {
            font-size: 1.2em;
            background: var(--amarelo);
            color: #333;
            display: inline-block;
            padding: 8px 25px;
            border-radius: 50px;
            margin-bottom: 20px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3);
        }

        h1 { color: var(--azul-primary); font-family: 'Montserrat', sans-serif; margin-bottom: 10px; }

        /* Grid de Animais */
        .animal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 340px;
            margin: 30px auto;
        }

        .animal-btn {
            width: 150px;
            height: 150px;
            background: var(--branco);
            border: 4px solid #ddd;
            border-radius: 30px;
            font-size: 80px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 #ccc;
        }

        .animal-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #ccc; }

        /* Cores de destaque para cada animal ao ativar */
        .animal-btn.active[id="0"] { background-color: #f8c291; border-color: #e67e22; } /* Cavalo */
        .animal-btn.active[id="1"] { background-color: #fff200; border-color: #f1c40f; } /* Galinha */
        .animal-btn.active[id="2"] { background-color: #7ed6df; border-color: #3498db; } /* Pato */
        .animal-btn.active[id="3"] { background-color: #a29bfe; border-color: #6c5ce7; } /* Vaca */

        .active { transform: scale(1.1); box-shadow: 0 0 25px rgba(0,0,0,0.2) !important; z-index: 5; }

        #msg { margin-top: 20px; font-size: 1.3em; font-weight: 600; min-height: 40px; }

        #start-btn {
            background: var(--azul-primary);
            color: white;
            padding: 15px 45px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(26, 26, 171, 0.3);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .wrong { animation: shake 0.4s ease; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-voltar">← Voltar</a>
        <h1 class="titulo-header">LogiClick</h1>
        <div style="width: 85px;"></div>
    </header>

    <div class="container">
        <div id="score-board">Nível: 0</div>
        <h1>Memória Animal 🐾</h1>
        <p>Ouça os animais e repita a sequência!</p>
        
        <div class="animal-grid" id="grid">
            <button class="animal-btn" id="0" title="Cavalo">🐎</button>
            <button class="animal-btn" id="1" title="Galinha">🐔</button>
            <button class="animal-btn" id="2" title="Pato">🦆</button>
            <button class="animal-btn" id="3" title="Vaca">🐮</button>
        </div>

        <div id="msg">Clique no botão para começar!</div>
        <button id="start-btn">Começar Fazenda</button>
    </div>

    <script>
        // SONS DOS ANIMAIS + SISTEMA
        const sounds = {
            0: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-horse-neigh-620.mp3'] }), // Cavalo
            1: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-chicken-cluck-1594.mp3'] }), // Galinha
            2: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-duck-quack-1593.mp3'] }), // Pato
            3: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-cow-moo-1595.mp3'] }), // Vaca
            error: new Howl({ src: ['https://actions.google.com/sounds/v1/cartoon/boing.ogg'], volume: 0.6 }),
            success: new Howl({ src: ['https://actions.google.com/sounds/v1/multimedia/success_point.ogg'], volume: 0.4 })
        };

        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let running = false;
        
        const buttons = document.querySelectorAll('.animal-btn');
        const startBtn = document.getElementById('start-btn');
        const msg = document.getElementById('msg');
        const scoreBoard = document.getElementById('score-board');

        function activateAnimal(id) {
            const btn = document.getElementById(id);
            sounds[id].play(); 
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 500);
        }

        async function playSequence() {
            running = false; 
            msg.innerText = "Ouça com atenção...";
            for (let id of sequence) {
                await new Promise(r => setTimeout(r, 900));
                activateAnimal(id);
            }
            running = true;
            msg.innerText = "Sua vez! Quem cantou?";
        }

        function nextLevel() {
            level++;
            scoreBoard.innerText = `Nível: ${level}`;
            playerSequence = [];
            sequence.push(Math.floor(Math.random() * 4));
            playSequence();
        }

        buttons.forEach(btn => {
            btn.onclick = () => {
                if (!running) return;
                
                const id = parseInt(btn.id);
                activateAnimal(id);
                playerSequence.push(id);

                if (playerSequence[playerSequence.length - 1] !== sequence[playerSequence.length - 1]) {
                    sounds.error.play();
                    msg.innerText = "Ih! O bicho foi outro...";
                    msg.style.color = "var(--erro)";
                    document.getElementById('grid').classList.add('wrong');
                    running = false;
                    setTimeout(resetGame, 1200);
                    return;
                }

                if (playerSequence.length === sequence.length) {
                    sounds.success.play();
                    msg.innerText = "Incrível! Você conhece a fazenda.";
                    msg.style.color = "var(--sucesso)";
                    running = false;
                    setTimeout(nextLevel, 1500);
                }
            };
        });

        function resetGame() {
            sequence = [];
            level = 0;
            scoreBoard.innerText = "Nível: 0";
            msg.style.color = "#333";
            msg.innerText = "Fim de papo! Vamos de novo?";
            document.getElementById('grid').classList.remove('wrong');
            startBtn.style.display = "inline-block";
            startBtn.innerText = "Reiniciar Fazenda";
        }

        startBtn.onclick = () => {
            startBtn.style.display = "none";
            msg.innerText = "Preparando os bichos...";
            nextLevel();
        };
    </script>
</body>
</html>
