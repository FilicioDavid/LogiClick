<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiClick - Complete a Palavra</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-primary: #1A1AAB;
            --fundo-creme: #FEFEE2;
            --branco: #ffffff;
            --laranja-destaque: #e67e22;
            --sucesso: #28a745;
            --erro: #e74c3c;
        }

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: var(--fundo-creme);
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            background-color: var(--azul-primary);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: white;
            box-sizing: border-box;
        }

        .btn-voltar {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn-voltar:hover {
            background: white;
            color: var(--azul-primary);
        }

        .titulo-header {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            margin: 0;
        }

        .container {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        #fase {
            font-size: 1.1em;
            background: var(--laranja-destaque);
            color: white;
            display: inline-block;
            padding: 8px 25px;
            border-radius: 50px;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.2);
        }

        h1 {
            color: var(--azul-primary);
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 10px;
        }

        #palavra {
            font-size: 4em;
            letter-spacing: 8px;
            margin: 50px 0;
            text-transform: uppercase;
            color: #2c3e50;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }

        .lacuna {
            color: var(--laranja-destaque);
            border-bottom: 6px solid var(--laranja-destaque);
            padding: 0 10px;
            min-width: 60px;
            display: inline-block;
            text-align: center;
        }

        .opcoes-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px auto;
        }

        .card {
            min-width: 85px;
            height: 85px;
            font-size: 1.8em;
            font-weight: bold;
            cursor: pointer;
            background: var(--branco);
            border: none;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            color: var(--azul-primary);
            font-family: 'Montserrat', sans-serif;
        }

        .card:hover {
            transform: translateY(-8px);
            background-color: var(--azul-primary);
            color: white;
        }

        #mensagem {
            margin-top: 30px;
            font-size: 1.3em;
            font-weight: 600;
            height: 40px;
        }

        .correto { color: var(--sucesso); animation: pulse 0.5s ease; }
        .errado { color: var(--erro); animation: shake 0.4s ease; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @media (max-width: 600px) {
            #palavra { font-size: 2.2em; letter-spacing: 4px; }
            .card { min-width: 70px; height: 70px; font-size: 1.4em; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-voltar">← Voltar</a>
        <h1 class="titulo-header">LogiClick</h1>
        <div style="width: 85px;"></div>
    </header>

    <div class="container">
        <div id="fase">Fase 1</div>
        <h1>Complete a palavra corretamente</h1>

        <div id="palavra"></div>

        <div id="opcoes" class="opcoes-container"></div>

        <div id="mensagem"></div>
    </div>

    <script>
        // Banco de palavras corrigido: [Palavra com _, Resposta correta]
        const bancoPalavras = [
            ["C_SA", "A"], ["B_LA", "O"], ["G_TO", "A"], ["P_TO", "A"], ["M_SA", "E"],
            ["L_VRO", "I"], ["F_GO", "O"], ["D_DO", "A"], ["B_CA", "O"], ["L_TA", "A"],
            ["P_NELA", "A"], ["C_NELA", "A"], ["B_NECA", "O"], ["S_PATO", "A"], ["R_TO", "A"],
            ["V_CA", "A"], ["M_CO", "A"], ["B_LE", "U"], ["P_RA", "E"], ["T_LA", "E"],
            ["CA_ORRO", "CH"], ["I_HA", "L"], ["CO_E_O", "LH"], ["GA_O", "LH"], ["MI_O", "LH"],
            ["TE_ADO", "LH"], ["I_REJA", "G"], ["CAR_O", "R"], ["FE_O", "RR"], ["TE_A", "RR"],
            ["A_OZ", "RR"], ["PA_ARO", "SS"], ["O_SO", "S"], ["PE_OA", "SS"], ["MI_ÃO", "SS"],
            ["BI_ICLETA", "C"], ["TRE_A", "CH"], ["CHU_A", "V"], ["FL_RESTA", "O"], ["ES_OLA", "C"],
            ["A_ELHA", "B"], ["O_ELHA", "V"], ["CO_ELHO", "E"], ["GA_INHA", "L"], ["URU_U", "B"],
            ["JA_ARÉ", "C"], ["GI_AFA", "R"], ["E_COVA", "S"], ["BRA_IL", "S"], ["A_UL", "Z"],
            ["BI_HO", "C"], ["AR_ORE", "V"], ["SA_ATO", "P"], ["CO_RA", "B"],
            ["PE_XE", "I"], ["FEI_ÃO", "J"], ["A_EITE", "Z"], ["PI_A", "ZZ"], ["HAM_URGUER", "B"]
        ];

        let fase = 1;
        let bloqueado = false;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function gerar() {
            const displayPalavra = document.getElementById("palavra");
            const divOpcoes = document.getElementById("opcoes");
            const msg = document.getElementById("mensagem");
            const labelFase = document.getElementById("fase");

            divOpcoes.innerHTML = "";
            msg.innerText = "";
            msg.className = "";
            bloqueado = false;

            // Seleciona palavra aleatória
            let item = bancoPalavras[Math.floor(Math.random() * bancoPalavras.length)];
            let textoBase = item[0];
            let respostaCorreta = item[1];

            // Monta o display com a lacuna
            displayPalavra.innerHTML = textoBase.replace("_", '<span class="lacuna">?</span>');

            // Gera distraidores baseados no tipo de resposta (letras ou dígrafos)
            let distraidores = [];
            if (respostaCorreta.length >= 2) {
                distraidores = ["SS", "RR", "CH", "LH", "NH", "ZZ"].filter(d => d !== respostaCorreta);
            } else if (["A", "E", "I", "O", "U"].includes(respostaCorreta)) {
                distraidores = ["A", "E", "I", "O", "U"].filter(d => d !== respostaCorreta);
            } else {
                distraidores = ["B", "C", "D", "P", "S", "R", "L", "V", "J", "X"].filter(d => d !== respostaCorreta);
            }
            
            shuffle(distraidores);
            let opcoes = [respostaCorreta, distraidores[0], distraidores[1]];
            opcoes = shuffle(opcoes);

            opcoes.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "card";
                btn.innerText = opt;

                btn.onclick = function() {
                    if (bloqueado) return;

                    if (opt === respostaCorreta) {
                        bloqueado = true;
                        msg.className = "correto";
                        msg.innerText = "Muito bem! Você acertou.";
                        
                        document.querySelector(".lacuna").innerText = opt;
                        document.querySelector(".lacuna").style.color = "var(--sucesso)";
                        document.querySelector(".lacuna").style.borderBottomColor = "var(--sucesso)";

                        fase++;
                        setTimeout(() => {
                            labelFase.innerText = "Fase " + fase;
                            gerar();
                        }, 1200);
                    } else {
                        msg.className = "errado";
                        msg.innerText = "Tente novamente!";
                        btn.style.backgroundColor = "#fee";
                        btn.style.color = "var(--erro)";
                        setTimeout(() => {
                             btn.style.backgroundColor = "";
                             btn.style.color = "";
                             msg.innerText = "";
                             msg.className = "";
                        }, 800);
                    }
                };
                divOpcoes.appendChild(btn);
            });
        }

        gerar();
    </script>
</body>
</html>
