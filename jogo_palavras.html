<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiClick PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde: #58CC02;
            --verde-dark: #46A302;
            --erro: #FF4B4B;
            --azul: #1CB0F6;
            --texto: #3C3C3C;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; background: #FFF; color: var(--texto);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Header */
        header {
            padding: 15px 25px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid #E5E5E5;
        }

        .vidas { font-size: 1.4rem; letter-spacing: 5px; }
        .score { font-weight: bold; color: var(--azul); }

        /* Area do Jogo */
        .game {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
        }

        #emoji { font-size: 5rem; margin-bottom: 10px; }
        
        #palavra {
            font-family: 'Righteous', cursive;
            font-size: 3.5rem; letter-spacing: 10px; margin-bottom: 40px;
            text-transform: uppercase;
        }

        .lacuna {
            color: #CCC; border-bottom: 5px solid #CCC;
            display: inline-block; min-width: 45px; text-align: center;
        }

        /* Botões Estilo Duolingo */
        .opcoes {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 15px; width: 100%; max-width: 450px;
        }

        .btn-opcao {
            background: white; border: 2px solid #E5E5E5; border-bottom: 6px solid #E5E5E5;
            border-radius: 15px; padding: 20px; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; transition: 0.1s; font-family: 'Righteous';
        }

        .btn-opcao:active { border-bottom-width: 2px; transform: translateY(4px); }
        .btn-opcao.errado { border-color: var(--erro); color: var(--erro); animation: shake 0.4s; }
        .btn-opcao.correto { border-color: var(--verde); color: var(--verde); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Tela de Bloqueio */
        #bloqueio {
            display: none; position: fixed; inset: 0; background: white;
            z-index: 100; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        #timer { font-size: 3rem; font-weight: bold; color: var(--erro); margin: 20px; }
    </style>
</head>
<body>

    <div id="bloqueio">
        <h1 style="font-size: 4rem;">💔</h1>
        <h2>Vidas Esgotadas!</h2>
        <p>Recuperando energia em:</p>
        <div id="timer">10:00</div>
    </div>

    <header>
        <div class="score" id="fase-txt">FASE: 1</div>
        <div class="vidas" id="coracoes">❤️❤️❤️</div>
    </header>

    <div class="game">
        <div id="emoji">❓</div>
        <div id="palavra"></div>
        <div class="opcoes" id="container-opcoes"></div>
    </div>

    <script>
        // BANCO DE DADOS (Expanda até 200 aqui)
        const banco = [
            ["C_SA", "A", "🏠"], ["B_LA", "O", "⚽"], ["G_TO", "A", "🐱"],
            ["P_TO", "A", "🦆"], ["M_SA", "E", "🪑"], ["L_VRO", "I", "📖"],
            ["ED_CAÇ_O", "U", "🎓"], ["CA_ORRO", "CH", "🐶"], ["CO_E_O", "LH", "🐰"],
            ["_ONIBUS", "O", "🚌"], ["_LEFANTE", "E", "🐘"], ["P_NELA", "A", "🍳"],
            ["PI_A", "ZZ", "🍕"], ["G_TARRA", "UI", "🎸"], ["FR_TA", "U", "🍎"],
            ["_RAC_", "A", "🕷️"], ["B_RCO", "A", "⛵"], ["_V_ÃO", "A", "✈️"],
            ["ES_OLA", "C", "🏫"], ["FLO_ESTA", "R", "🌲"], ["G_RAFA", "I", "🦒"],
            ["_R_IA", "A", "🏖️"], ["S_P_TO", "A", "👞"], ["B_NECA", "O", "🪆"],
            ["C_RRO", "A", "🚗"], ["M_C_CO", "A", "🐒"], ["_VA", "U", "🍇"],
            ["_VO", "O", "🥚"], ["L_ITE", "E", "🥛"], ["P_O", "Ã", "🍞"]
            // Adicione mais seguindo o padrão ["P_L_VRA", "Letra", "Emoji"]
        ];

        let vidas = parseInt(localStorage.getItem('logi_vidas')) || 3;
        let fase = 1;

        function atualizarVidas() {
            document.getElementById('coracoes').innerText = "❤️".repeat(vidas) + "🖤".repeat(3 - vidas);
            localStorage.setItem('logi_vidas', vidas);
            if(vidas <= 0) dispararBloqueio();
        }

        function dispararBloqueio() {
            const lockTime = localStorage.getItem('logi_lock') || Date.now() + 600000;
            localStorage.setItem('logi_lock', lockTime);
            document.getElementById('bloqueio').style.display = 'flex';
            
            const intervalo = setInterval(() => {
                const restante = Math.ceil((lockTime - Date.now()) / 1000);
                if(restante <= 0) {
                    clearInterval(intervalo);
                    vidas = 3;
                    localStorage.removeItem('logi_lock');
                    location.reload();
                }
                const m = Math.floor(restante / 60);
                const s = restante % 60;
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        function novoJogo() {
            if(localStorage.getItem('logi_lock')) return dispararBloqueio();
            
            const item = banco[Math.floor(Math.random() * banco.length)];
            const [txt, certa, emoji] = item;
            
            document.getElementById('emoji').innerText = emoji;
            document.getElementById('palavra').innerHTML = txt.replace(/_/g, '<span class="lacuna">?</span>');
            
            // Gerar opções
            let opts = [certa];
            const letras = "AEIOUBCDFGLMPRSTVXZ";
            while(opts.length < 3) {
                let r = letras[Math.floor(Math.random() * letras.length)];
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);

            const container = document.getElementById('container-opcoes');
            container.innerHTML = '';
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcao';
                btn.innerText = o;
                btn.onclick = () => {
                    if(o === certa) {
                        btn.classList.add('correto');
                        document.querySelectorAll('.lacuna').forEach(l => l.innerText = o);
                        fase++;
                        setTimeout(() => {
                            document.getElementById('fase-txt').innerText = "FASE: " + fase;
                            novoJogo();
                        }, 800);
                    } else {
                        btn.classList.add('errado');
                        vidas--;
                        atualizarVidas();
                        setTimeout(() => btn.classList.remove('errado'), 500);
                    }
                };
                container.appendChild(btn);
            });
        }

        atualizarVidas();
        novoJogo();
    </script>
</body>
</html>
