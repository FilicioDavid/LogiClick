<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiClick PRO - Desafio das Palavras</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-primary: #1A1AAB;
            --fundo-creme: #FEFEE2;
            --laranja-destaque: #e67e22;
            --sucesso: #28a745;
            --erro: #e74c3c;
        }

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: var(--fundo-creme);
            margin: 0; padding: 0;
            min-height: 100vh;
            user-select: none;
        }

        header {
            background-color: var(--azul-primary);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .status-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .vidas { font-size: 1.5rem; color: #ff4757; }
        
        #fase-badge {
            background: var(--laranja-destaque);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; }

        /* Estilo da Palavra e Emoji */
        #emoji-display { font-size: 4rem; margin-top: 20px; display: block; }
        #palavra {
            font-size: 3rem;
            letter-spacing: 5px;
            margin: 20px 0;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }

        .lacuna {
            color: var(--laranja-destaque);
            border-bottom: 5px solid var(--laranja-destaque);
            min-width: 30px;
            display: inline-block;
        }

        /* Opções */
        .opcoes-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .card {
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: white;
            box-shadow: 0 5px 0 #ddd;
            cursor: pointer;
            transition: 0.1s;
        }

        .card:active { transform: translateY(3px); box-shadow: 0 2px 0 #ddd; }
        .card:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Overlay de Bloqueio (Vidas Esgotadas) */
        #overlay-bloqueio {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #timer-recuperacao { font-size: 2rem; color: var(--laranja-destaque); margin-top: 10px; }
    </style>
</head>
<body>

    <div id="overlay-bloqueio">
        <h2>Vidas Esgotadas! 💔</h2>
        <p>Recuperando energia em:</p>
        <div id="timer-recuperacao">00:00</div>
    </div>

    <header>
        <div id="fase-badge">Fase 1</div>
        <div class="status-container">
            <div class="vidas" id="coracoes">❤️❤️❤️</div>
        </div>
    </header>

    <div class="container">
        <span id="emoji-display">❓</span>
        <h2 id="palavra"></h2>
        <div id="opcoes" class="opcoes-container"></div>
        <h3 id="feedback"></h3>
    </div>

    <script>
        // CONFIGURAÇÕES DO MODO PROFISSIONAL
        const TEMPO_RECUPERACAO_MS = 10 * 60 * 1000; // 10 minutos
        const MAX_VIDAS = 3;

        // BANCO DE PALAVRAS (Exemplos de diversos tipos)
        const bancoPalavras = [
            ["C_S_", "A", "🏠", "vogal"], ["B_L_", "O", "⚽", "vogal"], ["G_T_", "A", "🐱", "vogal"],
            ["ED_C_ÇÃO", "U", "🎓", "vogal"], ["C_CH_RRO", "O", "🐶", "vogal"], ["_CA", "O", "🍇", "vogal"],
            ["P_N_LA", "E", "🍳", "vogal"], ["B_N_CA", "E", "🪆", "vogal"], ["C_RRO", "A", "🚗", "vogal"],
            ["I_REJA", "G", "⛪", "consoante"], ["CO_E_O", "LH", "🐰", "digrafo"], ["MI_O", "LH", "🌽", "digrafo"],
            ["FE_O", "RR", "🛠️", "digrafo"], ["TE_A", "RR", "🌍", "digrafo"], ["A_OZ", "RR", "🍚", "digrafo"],
            ["PA_ARO", "SS", "🐦", "digrafo"], ["O_O", "SS", "🐻", "digrafo"], ["PE_OA", "SS", "👤", "digrafo"],
            ["BI_ICLETA", "C", "🚲", "consoante"], ["CHU_A", "V", "🌧️", "consoante"], ["ES_OLA", "C", "🏫", "consoante"],
            ["A_ELHA", "B", "🐝", "consoante"], ["JA_ARÉ", "C", "🐊", "consoante"], ["GI_AFA", "R", "🦒", "consoante"],
            ["BRA_IL", "S", "🇧🇷", "consoante"], ["A_UL", "Z", "🟦", "consoante"], ["AR_ORE", "V", "🌳", "consoante"],
            ["SA_ATO", "P", "👞", "consoante"], ["CO_RA", "B", "🐍", "consoante"], ["PI_A", "ZZ", "🍕", "digrafo"],
            ["FLU_TU_R", "A", "🎈", "vogal"], ["_LEFANTE", "E", "🐘", "vogal"], ["_ONIBUS", "O", "🚌", "vogal"],
            ["M_R_NG_O", "A", "🍓", "vogal"], ["_AC_CO", "M", "🐒", "consoante"], ["G_L_NHA", "A", "🐔", "vogal"]
            // Nota: Você pode expandir esta lista até 200 facilmente seguindo o padrão.
        ];

        let fase = 1;
        let vidas = parseInt(localStorage.getItem('logiclick_vidas')) || MAX_VIDAS;
        let bloqueado = false;

        function atualizarVidasUI() {
            document.getElementById('coracoes').innerText = "❤️".repeat(vidas) + "🖤".repeat(MAX_VIDAS - vidas);
            localStorage.setItem('logiclick_vidas', vidas);
            
            if (vidas <= 0) {
                verificarBloqueio();
            }
        }

        function verificarBloqueio() {
            const tempoBloqueio = localStorage.getItem('logiclick_locktime');
            const agora = Date.now();

            if (tempoBloqueio && agora < tempoBloqueio) {
                document.getElementById('overlay-bloqueio').style.display = 'flex';
                const restante = Math.ceil((tempoBloqueio - agora) / 1000);
                const min = Math.floor(restante / 60);
                const sec = restante % 60;
                document.getElementById('timer-recuperacao').innerText = `${min}:${sec < 10 ? '0'+sec : sec}`;
                setTimeout(verificarBloqueio, 1000);
            } else {
                if (vidas <= 0) {
                    vidas = MAX_VIDAS;
                    atualizarVidasUI();
                }
                document.getElementById('overlay-bloqueio').style.display = 'none';
            }
        }

        function perderVida() {
            vidas--;
            atualizarVidasUI();
            if (vidas <= 0) {
                const lockUntil = Date.now() + TEMPO_RECUPERACAO_MS;
                localStorage.setItem('logiclick_locktime', lockUntil);
                verificarBloqueio();
            }
        }

        function gerar() {
            if (vidas <= 0) return;
            
            const displayPalavra = document.getElementById("palavra");
            const divOpcoes = document.getElementById("opcoes");
            const feedback = document.getElementById("feedback");
            const emojiDisplay = document.getElementById("emoji-display");

            divOpcoes.innerHTML = "";
            feedback.innerText = "";
            bloqueado = false;

            let item = bancoPalavras[Math.floor(Math.random() * bancoPalavras.length)];
            let [texto, correta, emoji, tipo] = item;

            emojiDisplay.innerText = emoji;
            displayPalavra.innerHTML = texto.replace(/_/g, '<span class="lacuna">?</span>');

            let distratores = (tipo === "vogal") ? ["A", "E", "I", "O", "U"] : 
                             (tipo === "digrafo") ? ["RR", "SS", "LH", "CH", "NH"] : ["B", "C", "D", "P", "S"];
            
            let opcoes = [correta, ...distratores.filter(d => d !== correta).sort(() => 0.5 - Math.random()).slice(0, 2)];
            opcoes = opcoes.sort(() => 0.5 - Math.random());

            opcoes.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "card";
                btn.innerText = opt;
                btn.onclick = () => {
                    if (bloqueado) return;
                    if (opt === correta) {
                        bloqueado = true;
                        feedback.innerText = "Correto! ✨";
                        feedback.style.color = "var(--sucesso)";
                        document.querySelectorAll(".lacuna").forEach(l => l.innerText = opt);
                        fase++;
                        setTimeout(() => {
                            document.getElementById("fase-badge").innerText = "Fase " + fase;
                            gerar();
                        }, 1200);
                    } else {
                        feedback.innerText = "Errado! ❌";
                        feedback.style.color = "var(--erro)";
                        perderVida();
                        btn.disabled = true;
                        btn.style.background = "#ffcccc";
                    }
                };
                divOpcoes.appendChild(btn);
            });
        }

        // Inicialização
        atualizarVidasUI();
        verificarBloqueio();
        if (vidas > 0) gerar();
    </script>
</body>
</html>
